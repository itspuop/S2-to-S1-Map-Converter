name: Python converter tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional mesh dependencies
        run: python -m pip install -r S2ToCSS_Converter/requirements.txt
      - name: Compile Python modules
        working-directory: S2ToCSS_Converter
        run: python -m compileall -q s2css
      - name: Run unit tests
        working-directory: S2ToCSS_Converter
        run: python -m unittest -v test_model_inventory test_model_pipeline test_mesh_decode test_mesh_validate test_vmf_export test_mesh_schema
      - name: Run smoke tests
        working-directory: S2ToCSS_Converter
        run: python test_smoke.py
